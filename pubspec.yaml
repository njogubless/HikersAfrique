name: hikersafrique
description: An Application for Hiking
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter 
  cupertino_icons: ^1.0.2
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  google_nav_bar: ^5.0.6
  curved_navigation_bar: ^1.0.3
  provider: ^6.0.5
  email_validator: ^3.0.0
  flutter_spinkit: ^5.1.0
  firebase_core: ^3.1.1
  pdf: ^3.9.0
  printing: ^5.10.4
  uuid: ^4.4.0
  url_launcher: ^6.1.11
  flutter_dotenv: ^5.0.2
  flutterwave_standard: ^1.0.8
  file_picker: ^8.0.6
  firebase_storage: ^12.1.0
  fluttertoast: ^8.2.2
  logger: ^2.3.0
  flutter_lints: ^4.0.0
  image_picker: ^1.0.1
  http: ^1.2.1
  flutter_config: ^2.0.2
  mpesa_flutter_plugin: ^1.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/.env

  fonts:
    - family: Cera-Pro
      fonts:
        - asset: fonts/Cera-Pro-Bold.otf
        - asset: fonts/Cera-Pro-Medium.otf
